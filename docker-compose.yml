version: '3'
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - N8N_ENCRYPTION_KEY=your-encryption-key-here
      - N8N_HOST=https://n8n-8d7e.onrender.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_BASE_URL=https://n8n-8d7e.onrender.com
    volumes:
      - ~/.n8n:/home/node/.n8n
    ports:
      - "5678:5678"
